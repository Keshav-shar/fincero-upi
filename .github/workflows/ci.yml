name: ci

on:
  push:
    branches: [main]
  pull_request:

# Jobs ask for more only where they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything below runs inside this image, so CI matches local builds (ADR-005).
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ref
        env:
          DOCKERFILE_HASH: ${{ hashFiles('docker/toolchain.Dockerfile') }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/toolchain:${DOCKERFILE_HASH}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/toolchain.Dockerfile
          push: true
          tags: ${{ steps.ref.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  format-lint:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'docker/toolchain.Dockerfile') }}
      - name: Format
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -- '*.cpp' '*.hpp' | xargs -r clang-format --dry-run --Werror
      - name: Gate self-tests
        run: python3 cmake/tests/test_gates.py
      - name: Core purity
        run: python3 cmake/check_core_purity.py core
      - name: Migration rules
        run: python3 cmake/check_migrations.py db/migrations
      - name: Module boundaries
        run: |
          cmake --preset dev --graphviz="$FINCERO_BUILD_ROOT/dev/targets.dot"
          python3 cmake/check_boundaries.py "$FINCERO_BUILD_ROOT/dev/targets.dot"

  build-test:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    strategy:
      fail-fast: false
      matrix:
        # `ci` also runs clang-tidy.
        preset: [ci, ci-gcc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'docker/toolchain.Dockerfile') }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # ThreadSanitizer needs a syscall that the default seccomp profile blocks (ADR-005).
      options: --user 0 ${{ matrix.preset == 'tsan' && '--security-opt seccomp=unconfined' || '' }}
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'docker/toolchain.Dockerfile') }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  fuzz-smoke:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'docker/toolchain.Dockerfile') }}
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz
      - name: 60 seconds per target
        run: |
          find "$FINCERO_BUILD_ROOT/fuzz/tests/fuzz" -maxdepth 1 -type f -executable -name 'fuzz_*' \
            -exec {} -max_total_time=60 \;

  # Added with the milestone that gives them something to run:
  #   db              M2  dbmate up against a Postgres service, schema tests
  #   integration     M2  compose stack, sandbox_psp failure scenarios
  #   client          M5  tsc, ESLint, Jest
  #   assistant-stub  M8  stub evals
